<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1A2942">
<title>Catálogo - Pulpería Herrera</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg-deep: #1A2942;
  --bg: #223353;
  --bg-soft: #2A3D62;
  --bg-elev: #354A72;
  --bg-hover: #3E5480;
  --card-body-bg-1: #16223A;
  --card-body-bg-2: #0F1A2E;
  --ink: #E6ECF7;
  --ink-soft: #9AA8C2;
  --ink-mute: #5D6B88;
  --green: #2E7D32;
  --green-deep: #1B5E20;
  --green-soft: rgba(46, 125, 50, 0.15);
  --green-glow: rgba(46, 125, 50, 0.40);
  --gold: #c9a54a;
  --gold-soft: rgba(232, 184, 90, 0.55);
  --gold-glow: rgba(232, 184, 90, 0.25);
  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.13);
  --shadow-inset-top: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --yellow: #E8B85A;
  --yellow-border: rgba(232, 184, 90, 0.35);
  --red: #EF4444;
  --red-soft: rgba(239, 68, 68, 0.15);
  --red-border: rgba(239, 68, 68, 0.35);
  --red-strong: #DC2626;
  --navy:#16264a; --basec:#2c4787;
  --base-h:12px; --bump-h:54px; --bump-w:128px; --r:24px; --rx:56px;
  --gap: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-tap-highlight-color: transparent; background: var(--bg-deep); }

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  color: var(--ink);
  padding-bottom: 140px;
  overflow-x: hidden;
  background: 
    radial-gradient(ellipse 140% 70% at 50% -10%, #34496F 0%, transparent 55%),
    radial-gradient(ellipse 100% 50% at 50% 110%, #253759 0%, transparent 60%),
    linear-gradient(180deg, #253759 0%, #1A2942 100%);
  background-attachment: fixed;
  font-feature-settings: 'cv11', 'ss01';
  letter-spacing: -0.01em;
}
body.modal-open { overflow: hidden; position: fixed; width: 100%; }

/* ⬇️ HEADER CORREGIDO (Sin línea, sin blur, con fondo sólido) */
.header {
  position: sticky; top: 0; z-index: 50;
  padding: 20px 16px 0;
  background: linear-gradient(180deg, #1A2942 0%, #1A2942 85%, rgba(26, 41, 66, 0) 100%);
  border-bottom: none;
}

.header-top { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 18px; max-width: 720px; margin-left: auto; margin-right: auto; position: relative; }
.header-top::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 60px; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(232, 184, 90, 0.6) 50%, transparent 100%); pointer-events: none; }
.brand-icon { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: var(--gold); filter: drop-shadow(0 2px 6px rgba(232, 184, 90, 0.35)); flex-shrink: 0; }
.header-brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--ink); display: flex; align-items: baseline; gap: 6px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }
.brand-pulperia { color: var(--ink); font-weight: 700; letter-spacing: 0.2px; }
.brand-herrera { background: linear-gradient(135deg, var(--green) 0%, #4CAF50 50%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; font-weight: 900; letter-spacing: -0.3px; filter: drop-shadow(0 1px 4px var(--green-glow)); }

.search-wrap { max-width: 720px; margin: 0 auto; position: relative; }
.search-wrap::before { content: ''; position: absolute; inset: 0; border-radius: 16px; padding: 1.5px; background: linear-gradient(145deg, rgba(255, 225, 140, 0.55) 0%, rgba(232, 184, 90, 0.20) 30%, rgba(232, 184, 90, 0.10) 50%, rgba(232, 184, 90, 0.20) 70%, rgba(255, 225, 140, 0.50) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; z-index: 3; transition: box-shadow 0.3s ease; }
.search-wrap:focus-within::before { background: linear-gradient(145deg, rgba(46, 125, 50, 0.75) 0%, rgba(46, 125, 50, 0.30) 50%, rgba(46, 125, 50, 0.70) 100%); box-shadow: 0 0 20px var(--green-glow); }

.search-input {
  width: 100%;
  border: none;
  background: radial-gradient(ellipse 90% 60% at 50% 0, rgba(255,255,255,.15), rgba(255,255,255,0) 70%), linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.22)), #16264a;
  border-radius: 16px;
  padding: 15px 46px 15px 50px;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  outline: none;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 8px 12px -2px rgba(0,0,0,.85), 0 16px 26px -6px rgba(0,0,0,.65), 0 0 14px rgba(0,0,0,.45), inset 0 1.5px 0 rgba(255,255,255,.38), inset 0 -4px 7px rgba(0,0,0,.35);
  transition: all 0.15s ease;
  position: relative;
  z-index: 2;
}

.search-input:active {
  transform: scale(0.98);
  box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.6), inset 0 -1px 0 rgba(255, 255, 255, 0.02), 0 2px 4px rgba(0, 0, 0, 0.2);
}

.search-input::placeholder {
  color: rgba(230, 236, 247, 0.6);
  font-weight: 500;
  letter-spacing: 0.2px;
}
/* ⬇️ ICONO VERDE RESTAURADO */
.search-icon { 
  position: absolute; 
  left: 18px; 
  top: 50%; 
  transform: translateY(-50%); 
  color: var(--green); /* Verde original */
  pointer-events: none; 
  z-index: 4; 
  filter: drop-shadow(0 1px 4px var(--green-glow)); 
  transition: transform 0.25s ease; 
}
.search-wrap:focus-within .search-icon { color: var(--green); filter: drop-shadow(0 1px 4px var(--green-glow)); transform: translateY(-50%) scale(1.1); }

/* ⬇️ PASTILLAS (No tocar, ya están bien) */
.cats-sticky { 
  position: sticky; top: 110px; z-index: 45; 
  background: transparent; 
  border-bottom: none; 
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.25s ease; 
  will-change: transform; 
}
.cats-sticky.hidden { transform: translateY(-200%); opacity: 0; pointer-events: none; }
.cats { max-width: 720px; margin: 0 auto; padding: var(--gap) 16px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); }
.cats::-webkit-scrollbar { display: none; }
.cat-chip { flex-shrink: 0; position: relative; border: none; background: linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%); color: var(--ink-soft); border-radius: 22px; padding: 10px 18px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: -0.1px; cursor: pointer; transition: all 0.25s cubic-bezier(0.32, 0.72, 0, 1); white-space: nowrap; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 2px 4px rgba(0, 0, 0, 0.30), 0 4px 8px rgba(0, 0, 0, 0.25), 0 8px 16px rgba(0, 0, 0, 0.20); }
.cat-chip::before { content: ''; position: absolute; inset: 0; border-radius: 22px; padding: 1px; background: linear-gradient(145deg, rgba(255, 225, 140, 0.45) 0%, rgba(232, 184, 90, 0.20) 30%, rgba(232, 184, 90, 0.08) 50%, rgba(232, 184, 90, 0.20) 70%, rgba(255, 225, 140, 0.40) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; z-index: 2; }
.cat-chip:active { transform: scale(0.95); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 1px 2px rgba(0, 0, 0, 0.35), 0 2px 4px rgba(0, 0, 0, 0.25); }
.cat-chip.active { background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%); color: #FFF; font-weight: 800; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 2px 6px rgba(0, 0, 0, 0.30), 0 6px 14px var(--green-glow), 0 10px 22px rgba(0, 0, 0, 0.25); }
.cat-chip.active::before { background: linear-gradient(145deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0.10) 50%, rgba(255, 255, 255, 0.28) 100%); }

.grid-wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 20px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

/* ... TARJETAS Y MODALES (Sin cambios) ... */
.card { position: relative; background: var(--card-body-bg-2); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 2px 4px rgba(0, 0, 0, 0.45), 0 8px 16px rgba(0, 0, 0, 0.45), 0 20px 40px rgba(0, 0, 0, 0.55), 0 40px 60px -20px rgba(0, 0, 0, 0.65); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1), box-shadow 0.3s ease; will-change: transform; transform: translateY(0); }
.card::before { content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 2.5px; background: linear-gradient(145deg, rgba(255, 225, 140, 0.90) 0%, rgba(232, 184, 90, 0.50) 22%, rgba(232, 184, 90, 0.22) 50%, rgba(232, 184, 90, 0.50) 78%, rgba(255, 225, 140, 0.85) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; z-index: 2; box-shadow: 0 0 14px rgba(232, 184, 90, 0.18); }
.card::after { content: ''; position: absolute; left: 6%; right: 6%; bottom: -12px; height: 24px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(232, 184, 90, 0.32) 0%, rgba(232, 184, 90, 0) 70%); filter: blur(10px); pointer-events: none; z-index: 0; transition: opacity 0.3s ease, bottom 0.3s ease; opacity: 0.9; }
.card:hover { transform: translateY(-6px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 4px 8px rgba(0, 0, 0, 0.50), 0 14px 28px rgba(0, 0, 0, 0.50), 0 30px 55px rgba(0, 0, 0, 0.60), 0 55px 80px -20px rgba(0, 0, 0, 0.70); }
.card:hover::after { opacity: 1; bottom: -16px; }
.card:hover::before { box-shadow: 0 0 22px rgba(232, 184, 90, 0.30); }
.card:active { transform: translateY(-2px) scale(0.98); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 2px 6px rgba(0, 0, 0, 0.45), 0 8px 16px rgba(0, 0, 0, 0.40); transition: transform 0.12s ease, box-shadow 0.12s ease; }
.card.falta-inv::before { background: linear-gradient(145deg, rgba(252, 211, 77, 0.95) 0%, rgba(232, 184, 90, 0.55) 50%, rgba(252, 211, 77, 0.90) 100%); box-shadow: 0 0 12px rgba(252, 211, 77, 0.20); }
.card.falta-loy::before { background: linear-gradient(145deg, rgba(248, 113, 113, 0.95) 0%, rgba(239, 68, 68, 0.55) 50%, rgba(248, 113, 113, 0.90) 100%); box-shadow: 0 0 12px rgba(239, 68, 68, 0.20); }
.card.pulsing { animation: cardPulse 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
@keyframes cardPulse { 0% { transform: scale(1); } 40% { transform: scale(0.95); } 100% { transform: scale(1); } }
.card-feedback { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%); color: #FFF; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), 0 12px 32px var(--green-glow), 0 4px 12px rgba(0, 0, 0, 0.4); opacity: 0; pointer-events: none; z-index: 10; transform: translate(-50%, -50%) scale(0); }
.card-feedback.show { animation: feedbackPop 0.9s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
@keyframes feedbackPop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 45% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; } }
.card-foto-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: var(--bg-deep); overflow: hidden; box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(0, 0, 0, 0.30); z-index: 1; }
.card-foto-wrap::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(180deg, rgba(0,0,0,0.40) 0%, transparent 100%); z-index: 3; pointer-events: none; }
.card-foto { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.95) contrast(1.03); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
.card:hover .card-foto { transform: scale(1.03); }
.card-foto-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--ink-mute); background: radial-gradient(ellipse at center, rgba(42, 61, 98, 0.7) 0%, rgba(22, 34, 56, 0.95) 100%); }
.ribbon-wrap { position: absolute; bottom: 0; right: 0; width: 92px; height: 92px; overflow: hidden; pointer-events: none; z-index: 4; }
.ribbon { position: absolute; bottom: 19px; right: -34px; width: 130px; padding: 5px 0; text-align: center; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; transform: rotate(-45deg); background: linear-gradient(135deg, #E8B85A 0%, #C99B3F 100%); color: #1A1208; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35); }
.ribbon.ribbon-loy { background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%); color: #FFF; }
.card-body { padding: 14px 14px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; position: relative; background: linear-gradient(180deg, var(--card-body-bg-1) 0%, var(--card-body-bg-2) 100%); border-top: 1px solid rgba(255, 255, 255, 0.10); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), inset 0 6px 10px -4px rgba(0, 0, 0, 0.35); z-index: 2; }
.card-body::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.20) 30%, rgba(255, 255, 255, 0.25) 50%, rgba(255, 255, 255, 0.20) 70%, transparent 100%); pointer-events: none; }
.card-nombre { font-size: 13.5px; font-weight: 600; line-height: 1.35; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; letter-spacing: -0.15px; }
.card-footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: auto; width: 100%; }
.card-left { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
.card-precio { font-size: 16px; font-weight: 900; background: linear-gradient(135deg, #4CAF50 0%, var(--green) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; letter-spacing: -0.4px; text-shadow: 0 1px 6px var(--green-glow); }
.card-stock { font-size: 11px; font-weight: 600; color: var(--ink-mute); letter-spacing: 0.1px; }
.card-stock.stock-cero { color: var(--red-strong); font-weight: 800; }
.card-cart { position: relative; flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border-strong); background: linear-gradient(180deg, var(--bg-elev) 0%, var(--bg-soft) 100%); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-inset-top); transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease; }
.card-cart.con-items { background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%); color: #FFF; border-color: transparent; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.30), 0 4px 12px var(--green-glow); }
.card-cart.con-items.bump { animation: cartBump 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
@keyframes cartBump { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
.card-cart.bloqueado { background: linear-gradient(180deg, var(--bg-hover) 0%, var(--bg-soft) 100%); color: var(--ink-mute); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
.card-cart-badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #FFFFFF; color: #0B1322; font-size: 11px; font-weight: 800; display: none; align-items: center; justify-content: center; border: 2px solid var(--card-body-bg-2); box-shadow: 0 2px 6px rgba(0,0,0,0.45); letter-spacing: 0; }
.card-cart.con-items .card-cart-badge { display: flex; }
.card-cart-badge.bump { animation: badgeBump 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
@keyframes badgeBump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

.empty { grid-column: 1 / -1; padding: 70px 20px; text-align: center; color: var(--ink-mute); font-size: 14px; line-height: 1.6; }
.empty strong { display: block; color: var(--ink); font-size: 17px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.2px; }
.loading { grid-column: 1 / -1; padding: 70px 20px; text-align: center; color: var(--ink-mute); font-size: 14px; }
.spinner { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,0.08); border-top-color: var(--green); border-radius: 50%; margin: 0 auto 16px; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sentinel { grid-column: 1 / -1; height: 60px; display: flex; align-items: center; justify-content: center; }
.spinner-sm { width: 22px; height: 22px; border-width: 2px; margin: 0; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(6, 11, 20, 0.75); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 1000; align-items: flex-end; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal-sheet { background: radial-gradient(ellipse 120% 60% at 50% -10%, #3A4F76 0%, transparent 50%), linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%); width: 100%; max-width: 720px; max-height: 88vh; border-radius: 26px 26px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.08); border-top: 1px solid var(--border-strong); border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; overflow: hidden; }
.modal-sheet::before { content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(255, 235, 170, 0.65) 50%, transparent 100%); pointer-events: none; z-index: 5; }
.modal-overlay.show .modal-sheet { transform: translateY(0); }
.modal-handle { width: 44px; height: 4px; background: linear-gradient(90deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.30) 50%, rgba(255, 255, 255, 0.10) 100%); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; position: relative; z-index: 6; }
.modal-head { padding: 20px 60px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; flex-shrink: 0; position: relative; z-index: 4; gap: 4px; }
.modal-titulo { font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -0.4px; position: relative; padding-bottom: 10px; }
.modal-titulo::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 40px; height: 2px; background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%); border-radius: 1px; opacity: 0.85; }
.modal-subtitulo { font-size: 12.5px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0.1px; margin-top: 6px; }
.btn-vaciar-float { position: absolute; top: 18px; left: 18px; width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--red-border); background: linear-gradient(180deg, var(--red-soft) 0%, rgba(239, 68, 68, 0.05) 100%); color: var(--red-strong); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s ease, background 0.15s ease; z-index: 10; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 2px 6px rgba(0, 0, 0, 0.25); }
.btn-vaciar-float:active { transform: scale(0.88); background: linear-gradient(180deg, var(--red-soft) 0%, rgba(239, 68, 68, 0.15) 100%); }
.modal-body { flex: 1; overflow-y: auto; padding: 14px 18px 8px; -webkit-overflow-scrolling: touch; }

.cart-item-card { position: relative; background: linear-gradient(180deg, var(--card-body-bg-1) 0%, var(--card-body-bg-2) 100%); border-radius: 14px; padding: 0; margin-bottom: 10px; display: flex; gap: 0; align-items: stretch; overflow: hidden; min-height: 92px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 2px 6px rgba(0, 0, 0, 0.40), 0 8px 16px rgba(0, 0, 0, 0.30); }
.cart-item-card::before { content: ''; position: absolute; inset: 0; border-radius: 14px; padding: 1.5px; background: linear-gradient(145deg, rgba(255, 225, 140, 0.55) 0%, rgba(232, 184, 90, 0.25) 30%, rgba(232, 184, 90, 0.10) 50%, rgba(232, 184, 90, 0.25) 70%, rgba(255, 225, 140, 0.50) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; z-index: 3; }
.cart-item-card::after { content: ''; position: absolute; top: 0; left: 25%; right: 15%; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.20) 50%, transparent 100%); pointer-events: none; z-index: 4; }
.cart-item-card:last-child { margin-bottom: 0; }

<script>
const URL_API_GOOGLE = "https://script.google.com/macros/s/AKfycbwS3zwDj7NU1l4P580O2c28oVTi0y1OrY-iLB-PiXMU5KyoYpr2mRRz0LTcmWDuqRhalg/exec";
const WHATSAPP_NUM = '50661446321';
const STORAGE_KEY = 'carrito_ph_v1';
const CATALOGO_KEY = 'catalogo_ph_v2';
const PRODUCTOS_POR_PAGINA = 30;
let productos = [];
let productosFiltrados = [];
let categoriaActiva = 'Todas';
let busqueda = '';
let carrito = [];
let pago = null;
let searchTimer = null;
let productosMostrados = 0;
let sentinelEl = null;
let sentinelObserver = null;
const tarjetasRefs = {};
let productoModal = null;
let scrollBloqueadoY = 0;
let lastY = 0;
const SHOW_THRESHOLD = 2;
const HIDE_THRESHOLD = 10;
const TOP_SAFE_ZONE = 130;
const grid = document.getElementById('grid');
const catsSticky = document.getElementById('catsSticky');
const header = document.getElementById('header');
const dock = document.getElementById('dock');
function fmt(n) { return '₡' + (Number(n) || 0).toLocaleString('es-CR'); }
function showToast(msg, tipo) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.className = 'toast show' + (tipo ? ' ' + tipo : '');
  setTimeout(function() { t.className = 'toast'; }, 2600);
}
function escaparHTML(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function haptic(ms) {
  if (navigator.vibrate) navigator.vibrate(ms || 15);
}
function bloquearScroll() {
  scrollBloqueadoY = window.scrollY;
  document.body.style.top = -scrollBloqueadoY + 'px';
  document.body.classList.add('modal-open');
}
function desbloquearScroll() {
  document.body.classList.remove('modal-open');
  document.body.style.top = '';
  window.scrollTo(0, scrollBloqueadoY);
}
function hayModalAbierto() {
  return document.querySelector('.modal-overlay.show') !== null || document.getElementById('confirmOverlay').classList.contains('show');
}
function crearRipple(e, boton) {
  const rect = boton.getBoundingClientRect();
  const x = (e.clientX || (rect.left + rect.width / 2)) - rect.left;
  const y = (e.clientY || (rect.top + rect.height / 2)) - rect.top;
  const size = Math.max(rect.width, rect.height) * 2;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = size + 'px';
  ripple.style.height = size + 'px';
  ripple.style.left = (x - size / 2) + 'px';
  ripple.style.top = (y - size / 2) + 'px';
  boton.appendChild(ripple);
  setTimeout(function() { ripple.remove(); }, 650);
}
function ajustarStickyCats() {
  if (header && catsSticky) {
    const h = header.getBoundingClientRect().height;
    catsSticky.style.top = h + 'px';
  }
}
function onScroll() {
  const y = window.scrollY;
  if (y < TOP_SAFE_ZONE) {
    if (catsSticky.classList.contains('hidden')) { catsSticky.classList.remove('hidden'); }
    lastY = y;
    return;
  }
  const diff = y - lastY;
  if (diff <= -SHOW_THRESHOLD) {
    catsSticky.classList.remove('hidden');
    lastY = y;
  } else if (diff >= HIDE_THRESHOLD) {
    catsSticky.classList.add('hidden');
    lastY = y;
  }
}
function guardarCarrito() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(carrito)); } catch (e) {}
}
function cargarCarritoGuardado() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) carrito = JSON.parse(raw) || [];
  } catch (e) { carrito = []; }
}
function limpiarCarritoGuardado() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}
function guardarCatalogoCache(lista) {
  try { localStorage.setItem(CATALOGO_KEY, JSON.stringify({ ts: Date.now(), items: lista })); } catch (e) {}
}
function leerCatalogoCache() {
  try {
    const raw = localStorage.getItem(CATALOGO_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.items) return null;
    return data.items;
  } catch (e) { return null; }
}
function normalizarTexto(texto) {
  return String(texto).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, ' ')
    .trim();
}
function cargarCatalogo() {
  const cacheLocal = leerCatalogoCache();
  if (cacheLocal && cacheLocal.length) {
    productos = cacheLocal;
    sincronizarCarritoConCatalogo();
    construirCategorias();
    aplicarFiltros();
    actualizarCarrito();
  }
  fetch(URL_API_GOOGLE, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'obtenerCatalogo' })
  })
  .then(response => response.json())
  .then(function(resp) {
    if (!resp.success) {
      if (!cacheLocal || !cacheLocal.length) {
        grid.innerHTML = '<div class="empty"><strong>Error</strong>' + escaparHTML(resp.message) + '</div>';
      }
      return;
    }
    productos = (resp.productos || []).map(function(p) {
      return { id: p.id || ('n-' + p.nombre), nombre: p.nombre, nombreApp: p.nombreApp || p.nombre, precio: p.precio, foto: p.foto, categoria: p.categoria, estado: p.estado, stock: p.stock, etiquetas: p.etiquetas };
    });
    guardarCatalogoCache(productos);
    sincronizarCarritoConCatalogo();
    construirCategorias();
    aplicarFiltros();
    actualizarCarrito();
  })
  .catch(function(err) {
    if (!cacheLocal || !cacheLocal.length) {
      grid.innerHTML = '<div class="empty"><strong>Error de conexión</strong>' + escaparHTML(err) + '</div>';
    }
  });
}
function sincronizarCarritoConCatalogo() {
  const porId = {}, porNombre = {};
  productos.forEach(function(p) {
    porId[p.id] = p;
    if (!porNombre[p.nombre]) porNombre[p.nombre] = p;
  });
  carrito = carrito.map(function(it) {
    // los carritos guardados antes de este cambio no traen id: se buscan por nombre
    const p = it.id ? porId[it.id] : porNombre[it.nombre];
    if (p) {
      return { id: p.id, nombre: p.nombre, nombreApp: p.nombreApp, precio: p.precio, foto: p.foto || it.foto, cantidad: it.cantidad, stock: p.stock };
    }
    return { id: it.id || ('n-' + it.nombre), nombre: it.nombre, nombreApp: it.nombreApp || it.nombre, precio: it.precio, foto: it.foto, cantidad: it.cantidad, stock: it.stock };
  });
  guardarCarrito();
}
function construirCategorias() {
  const cats = new Set();
  productos.forEach(function(p) { if (p.categoria) cats.add(p.categoria); });
  const catsArr = Array.from(cats).sort(function(a,b){ return a.localeCompare(b,'es',{sensitivity:'base'}); });
  const cont = document.getElementById('cats');
  cont.innerHTML = '';
  const todas = document.createElement('button');
  todas.className = 'cat-chip active';
  todas.innerText = 'Todas';
  todas.dataset.cat = 'Todas';
  todas.addEventListener('click', function() { setCategoria('Todas'); });
  cont.appendChild(todas);
  catsArr.forEach(function(c) {
    const btn = document.createElement('button');
    btn.className = 'cat-chip';
    btn.innerText = c;
    btn.dataset.cat = c;
    btn.addEventListener('click', function() { setCategoria(c); });
    cont.appendChild(btn);
  });
}
function setCategoria(cat) {
  categoriaActiva = cat;
  document.querySelectorAll('.cat-chip').forEach(function(el) {
    el.classList.toggle('active', el.dataset.cat === cat);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  catsSticky.classList.remove('hidden');
  lastY = 0;
  aplicarFiltros();
}
const PALABRAS_VACIAS = new Set(['necesito','necesita','necesitamos','quiero','quisiera','busco','buscando','algo','alguna','alguno','para','hacer','hacerme','tienen','tiene','hay','venden','vende','me','un','una','unos','unas','el','la','los','las','de','del','por','favor','porfa','dame','pasame','cuanto','cuesta','vale','precio','que','en','al','lo','mi','y','o','como','cosa','cosas','mas']);
const SINONIMOS = {
  arepa: ['masa','maiz'], tortilla: ['masa','maiz'], tamal: ['masa','maiz'],
  soda: ['gaseosa','refresco'], gaseosa: ['refresco','cola'], refresco: ['gaseosa','fresco','jugo'],
  fresco: ['refresco','jugo','tang','zuko'], bebida: ['refresco','gaseosa','jugo'], jugo: ['nectar','refresco'],
  pelo: ['cabello'], cabello: ['pelo','shampoo','champu'], champu: ['shampoo'], shampoo: ['champu'],
  diente: ['dental','cepillo'], muela: ['dental','cepillo'],
  bebe: ['panal','colado','tetina'], nino: ['bebe','infantil'],
  desayuno: ['cereal','avena','cafe','huevo','pan'], merienda: ['galleta','jugo','snack'], lonchera: ['jugo','galleta','merienda'],
  boquita: ['snack'], snack: ['boquita'], chucheria: ['golosina','dulce','confite','snack'],
  dulce: ['golosina','confite'], golosina: ['dulce','confite'],
  verdura: ['cebolla','papa','tomate','repollo','ajo'], fruta: ['manzana'], carne: ['res','cerdo','pollo'],
  limpieza: ['cloro','jabon','detergente','escoba','pinol'], limpiar: ['cloro','jabon','detergente','escoba','pinol'],
  lavar: ['detergente','jabon','lavaplatos','suavizante'], escuela: ['lapiz','borrador','tajador','escolar'], colegio: ['lapiz','borrador','tajador','escolar'],
  fosforo: ['encendedor','yesquero'], yesquero: ['encendedor','fosforo'], vela: ['candela'],
  mantequilla: ['margarina'], margarina: ['mantequilla'], arroc: ['arroz'],
  dolor: ['acetaminofen','advil','aspirina','ibuprofeno','diclofenaco'], gripe: ['antigripal','tabcin'],
  fiebre: ['acetaminofen','panadol'], estomago: ['alka','antiacido']
};
const indiceBusqueda = new WeakMap();
function palabrasDe(texto) {
  return normalizarTexto(texto).split(/[^a-z0-9]+/).filter(Boolean);
}
function datosBusqueda(p) {
  let d = indiceBusqueda.get(p);
  if (!d) {
    d = {
      visible: normalizarTexto(p.nombreApp || p.nombre),
      nombre: palabrasDe(p.nombre + ' ' + (p.nombreApp || '')),
      categoria: palabrasDe(p.categoria || ''),
      etiquetas: palabrasDe(p.etiquetas || '')
    };
    indiceBusqueda.set(p, d);
  }
  return d;
}
function raizPalabra(w) {
  if (w.length > 4 && w.endsWith('es')) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith('s')) return w.slice(0, -1);
  return w;
}
function calidadCoincidencia(palabras, t) {
  let mejor = 0;
  for (let i = 0; i < palabras.length; i++) {
    const w = palabras[i];
    if (w === t) return 3;
    if (w.startsWith(t)) {
      const base = t.length >= 5 ? 2 : (t.length === 4 ? 1 : 0.7);
      const q = base * (0.5 + 0.5 * t.length / w.length);
      if (q > mejor) mejor = q;
    } else if (t.length >= 5 && w.indexOf(t) !== -1) {
      if (mejor < 1) mejor = 1;
    }
  }
  return mejor;
}
function puntosTermino(d, alternativas) {
  let mejor = 0;
  alternativas.forEach(function(alt) {
    const t = alt.t;
    let pNombre = calidadCoincidencia(d.nombre, t) * 30;
    if (pNombre > 0 && d.nombre[0].startsWith(t)) pNombre += 15; // bonus si es la primera palabra del nombre
    const p = Math.max(
      pNombre,
      calidadCoincidencia(d.categoria, t) * 15,
      calidadCoincidencia(d.etiquetas, t) * 20
    ) * alt.factor;
    if (p > mejor) mejor = p;
  });
  return mejor;
}
function porInicial(lista, q) {
  // 1) nombres que empiezan con lo escrito; si no hay, 2) palabras que empiezan así; si no, 3) que lo contengan
  const n1 = [], n2 = [], n3 = [];
  lista.forEach(function(p) {
    const d = datosBusqueda(p);
    if (d.visible.startsWith(q)) n1.push(p);
    else if (d.nombre.some(function(w) { return w.startsWith(q); })) n2.push(p);
    else if (d.visible.indexOf(q) !== -1) n3.push(p);
  });
  const r = n1.length ? n1 : (n2.length ? n2 : n3);
  return r.sort(function(a, b) {
    return datosBusqueda(a).visible.localeCompare(datosBusqueda(b).visible);
  });
}
function aplicarFiltros() {
  const qNormalizada = normalizarTexto(busqueda.trim());
  // al buscar, se busca en todo el catálogo (no solo en la categoría marcada)
  if (qNormalizada && categoriaActiva !== 'Todas') {
    categoriaActiva = 'Todas';
    document.querySelectorAll('.cat-chip').forEach(function(el) {
      el.classList.toggle('active', el.dataset.cat === 'Todas');
    });
  }
  const resultadosBase = productos.filter(function(p) {
    return (categoriaActiva === 'Todas' || p.categoria === categoriaActiva);
  });
  if (!qNormalizada) {
    productosFiltrados = resultadosBase;
  } else if (qNormalizada.length === 1) {
    productosFiltrados = porInicial(resultadosBase, qNormalizada);
  } else {
    const crudas = palabrasDe(qNormalizada).filter(function(w) { return w.length > 1; });
    let terminos = crudas.filter(function(w) { return !PALABRAS_VACIAS.has(w); });
    if (terminos.length === 0) terminos = crudas;
    const consulta = terminos.map(function(w) {
      const raiz = raizPalabra(w);
      const alts = [{ t: raiz, factor: 1 }];
      if (w !== raiz) alts.push({ t: w, factor: 1 });
      (SINONIMOS[raiz] || SINONIMOS[w] || []).forEach(function(s, i) { alts.push({ t: s, factor: i === 0 ? 0.8 : 0.5 }); });
      return alts;
    });
    const minimo = consulta.length <= 2 ? 1 : Math.ceil(consulta.length / 2);
    const puntuados = [];
    resultadosBase.forEach(function(p) {
      const d = datosBusqueda(p);
      let total = 0, coinciden = 0;
      consulta.forEach(function(alts) {
        const pt = puntosTermino(d, alts);
        if (pt > 0) { coinciden++; total += pt; }
      });
      if (coinciden >= minimo) puntuados.push({ producto: p, coinciden: coinciden, total: total });
    });
    puntuados.sort(function(a, b) {
      return (b.coinciden - a.coinciden) || (b.total - a.total);
    });
    let finales = puntuados;
    if (consulta.length === 1 && puntuados.length > 0) {
      // con una sola palabra, se descartan las coincidencias muy débiles frente a la mejor
      const corte = puntuados[0].total * 0.3;
      finales = puntuados.filter(function(x) { return x.total >= corte; });
    }
    productosFiltrados = finales.map(function(x) { return x.producto; });
    if (productosFiltrados.length === 0) productosFiltrados = porInicial(resultadosBase, qNormalizada);
  }

  document.getElementById('modalFormulario').classList.remove('show');
  if (!hayModalAbierto()) desbloquearScroll();
}
function setPago(tipo) {
  pago = tipo;
  document.getElementById('pagoContado').classList.toggle('active', tipo === 'contado');
  document.getElementById('pagoCredito').classList.toggle('active', tipo === 'credito');
}
function enviarPedido(e) {
  const nombre = document.getElementById('nombreCliente').value.trim();
  if (!nombre) { showToast('Escribí tu nombre', 'error'); document.getElementById('nombreCliente').focus(); return; }
  if (!pago) { showToast('Elegí una forma de pago', 'error'); return; }
  if (carrito.length === 0) { showToast('El carrito está vacío', 'error'); return; }
  if (e && e.currentTarget) { crearRipple(e, e.currentTarget); haptic(20); }
  const ahora = new Date();
  const dia = String(ahora.getDate()).padStart(2, '0');
  const mes = String(ahora.getMonth() + 1).padStart(2, '0');
  const anio = String(ahora.getFullYear()).slice(-2);
  const hh = String(ahora.getHours()).padStart(2, '0');
  const mm = String(ahora.getMinutes()).padStart(2, '0');
  const fechaHora = dia + '/' + mes + '/' + anio + ' · ' + hh + ':' + mm;
  const pagoTexto = (pago === 'credito' ? 'Crédito' : 'Contado');
  let msg = '';
  msg += '🌾 *PULPERÍA HERRERA*\n';
  msg += '_Nuevo pedido_\n\n';
  msg += '━━━━━━━━━━━━━━━\n';
  msg += '👤 *' + nombre + '* · 💳 ' + pagoTexto + '\n';
  msg += '🕒 ' + fechaHora + '\n';
  msg += '━━━━━━━━━━━━━━━\n\n';
  carrito.forEach(function(it, i) {
    const num = (i + 1) + '.';
    msg += num + ' ' + it.cantidad + 'x ' + (it.nombreApp || it.nombre) + '\n';
    msg += ' ' + fmt(it.precio) + ' c/u · ' + fmt(it.precio * it.cantidad) + '\n\n';
  });
  msg += '━━━━━━━━━━━━━━━\n';
  msg += '💰 *TOTAL: ' + fmt(totalCarrito()) + '*\n';
  msg += '━━━━━━━━━━━━━━━\n\n';
  msg += '_Paso a recogerlo en unos minutos_ ✅';
  const url = 'https://wa.me/' + WHATSAPP_NUM + '?text=' + encodeURIComponent(msg);
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  carrito = [];
  limpiarCarritoGuardado();
  actualizarCarrito();
  actualizarTodasLasTarjetas();
  cerrarFormulario();
  showToast('¡Pedido enviado!', 'success');
}
document.addEventListener('DOMContentLoaded', function() {
  ajustarStickyCats();
  window.addEventListener('resize', function(){ ajustarStickyCats(); drawOutline(); });
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(ajustarStickyCats); }
  cargarCarritoGuardado();
  actualizarCarrito();
  lastY = window.scrollY;
  window.addEventListener('scroll', onScroll, { passive: true });
  document.getElementById('searchInput').addEventListener('input', function() {
    const val = this.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
      busqueda = val;
      aplicarFiltros();
    }, 250);
  });
  document.getElementById('pmMas').addEventListener('click', modalMas);
  document.getElementById('pmMenos').addEventListener('click', modalMenos);
  document.getElementById('pmEliminar').addEventListener('click', modalEliminar);
  document.getElementById('pmListo').addEventListener('click', cerrarModalProducto);
  document.getElementById('modalProducto').addEventListener('click', function(ev) {
    if (ev.target === this) cerrarModalProducto();
  });
  document.getElementById('modalCarrito').addEventListener('click', function(ev) {
    if (ev.target === this) cerrarCarrito();
  });
  document.getElementById('modalFormulario').addEventListener('click', function(ev) {
    if (ev.target === this) cerrarFormulario();
  });
  document.getElementById('nombreCliente').addEventListener('keypress', function(ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); enviarPedido(); }
  });
  document.getElementById('confirmOverlay').addEventListener('click', function(ev) {
    if (ev.target === this) cerrarConfirm();
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(err) { console.log('SW error:', err); });
  }
  cargarCatalogo();
});
// ===== Tarjeta compacta (textos centrados, carrito abajo, lupa) y columnas según la pantalla =====
(function() {
  var estilo = document.createElement('style');
  estilo.textContent =
    '.card-cart { position: absolute !important; bottom: 8px; right: 8px; width: 36px; height: 36px; z-index: 6; }' +
    '.card-body { padding: 10px 10px 10px !important; gap: 4px !important; justify-content: center; align-items: center; text-align: center; }' +
    '.card-nombre { min-height: 0 !important; text-align: center; }' +
    '.card-footer { margin-top: 0 !important; justify-content: center; }' +
    '.card-left { align-items: center; text-align: center; justify-content: flex-start; min-height: 36px; }' +
    '@media (min-width: 700px) { .grid-wrap { max-width: 960px; } .grid { grid-template-columns: repeat(3, 1fr); } }' +
    '@media (min-width: 1100px) { .grid-wrap { max-width: 1240px; } .grid { grid-template-columns: repeat(4, 1fr); } }' +
    '.zoom-btn { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; padding: 0; border-radius: 50%; background: rgba(10,18,32,.55); border: 1px solid rgba(255,255,255,.30); color: #fff; display: flex; align-items: center; justify-content: center; z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,.4); cursor: pointer; }' +
    '.zoom-btn:active { transform: scale(.92); }' +
    '.vz { position: fixed; inset: 0; background: rgba(6,12,24,.95); display: none; align-items: center; justify-content: center; z-index: 500; }' +
    '.vz.show { display: flex; }' +
    '.vz-box { width: 100%; max-width: 720px; padding: 0 14px; display: flex; flex-direction: column; align-items: center; gap: 14px; }' +
    '.vz-img { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.6); border: 1px solid rgba(232,184,90,.35); background: #0f1a2e; }' +
    '.vz-nombre { font-weight: 700; font-size: 16px; color: var(--ink); text-align: center; }' +
    '.vz-precio { font-weight: 900; font-size: 19px; color: #4CAF50; }' +
    '.vz-hint { font-size: 12px; color: var(--ink-soft); }' +
    '.vz-x { position: absolute; top: 16px; right: 14px; width: 42px; height: 42px; padding: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color: #fff; font-size: 24px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; }';
  document.head.appendChild(estilo);

  var visor = null, visorImg = null, visorNombre = null, visorPrecio = null;

  // Pide la foto completa (sin recortar) en tamaño grande
  function urlFotoGrande(url) {
    try {
      var u = new URL(url);
      if (u.hostname === 'images.weserv.nl') {
        var original = u.searchParams.get('url');
        if (original) return 'https://images.weserv.nl/?url=' + encodeURIComponent(original) + '&w=1200&fit=inside&we=1&output=webp&q=85';
      }
    } catch (e) {}
    return url;
  }
  function crearVisor() {
    visor = document.createElement('div');
    visor.className = 'vz';
    visor.innerHTML =
      '<button type="button" class="vz-x" aria-label="Cerrar">×</button>' +
      '<div class="vz-box"><img class="vz-img" alt=""><div class="vz-nombre"></div><div class="vz-precio"></div><div class="vz-hint">Toca para cerrar</div></div>';
    visorImg = visor.querySelector('.vz-img');
    visorNombre = visor.querySelector('.vz-nombre');
    visorPrecio = visor.querySelector('.vz-precio');
    visor.addEventListener('click', cerrarVisor);
    document.body.appendChild(visor);
    document.addEventListener('keydown', function(ev) { if (ev.key === 'Escape') cerrarVisor(); });
  }
  function abrirVisor(p) {
    if (!visor) crearVisor();
    visorNombre.innerText = p.nombreApp || p.nombre;
    visorPrecio.innerText = fmt(p.precio);
    visorImg.src = p.foto;                       // se ve al instante la foto chica
    var grande = urlFotoGrande(p.foto);
    if (grande !== p.foto) {
      var pre = new Image();
      pre.onload = function() { if (visor.classList.contains('show')) visorImg.src = grande; };
      pre.src = grande;                          // y cuando llega la grande, la reemplaza
    }
    visor.classList.add('show');
    bloquearScroll();
  }
  function cerrarVisor() {
    if (!visor || !visor.classList.contains('show')) return;
    visor.classList.remove('show');
    if (!hayModalAbierto()) desbloquearScroll();
  }
  function agregarLupa(card, p) {
    var wrap = card.querySelector('.card-foto-wrap');
    if (!wrap || !p.foto) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'zoom-btn';
    b.setAttribute('aria-label', 'Ver foto completa');
    b.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>';
    b.addEventListener('click', function(ev) { ev.stopPropagation(); haptic(10); abrirVisor(p); });
    wrap.appendChild(b);
  }
  var crearTarjetaOriginal = crearTarjeta;
  crearTarjeta = function(p) {
    var card = crearTarjetaOriginal(p);
    agregarLupa(card, p);
    return card;
  };
})();
