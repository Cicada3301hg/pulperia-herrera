<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1A2942">
<title>Catálogo - Pulpería Herrera</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
--bg-deep: #1A2942;
--bg: #223353;
--bg-soft: #2A3D62;
--bg-elev: #354A72;
--bg-hover: #3E5480;
--card-body-bg-1: #16223A;
--card-body-bg-2: #0F1A2E;
--ink: #E6ECF7;
--ink-soft: #9AA8C2;
--ink-mute: #5D6B88;
--green: #2E7D32;
--green-deep: #1B5E20;
--green-soft: rgba(46, 125, 50, 0.15);
--green-glow: rgba(46, 125, 50, 0.40);
--gold: #c9a54a;
--gold-soft: rgba(232, 184, 90, 0.55);
--gold-glow: rgba(232, 184, 90, 0.25);
--border: rgba(255, 255, 255, 0.07);
--border-strong: rgba(255, 255, 255, 0.13);
--shadow-inset-top: inset 0 1px 0 rgba(255, 255, 255, 0.07);
--yellow: #E8B85A;
--yellow-border: rgba(232, 184, 90, 0.35);
--red: #EF4444;
--red-soft: rgba(239, 68, 68, 0.15);
--red-border: rgba(239, 68, 68, 0.35);
--red-strong: #DC2626;
--navy:#16264a;--basec:#2c4787;
--base-h:12px;--bump-h:54px;--bump-w:128px;--r:24px;--rx:56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-tap-highlight-color: transparent; background: var(--bg-deep); }
body {
font-family: 'Inter', system-ui, -apple-system, sans-serif;
min-height: 100vh;
color: var(--ink);
padding-bottom: 140px;
overflow-x: hidden;
background: radial-gradient(ellipse 140% 70% at 50% -10%, #34496F 0%, transparent 55%), radial-gradient(ellipse 100% 50% at 50% 110%, #253759 0%, transparent 60%), linear-gradient(180deg, #253759 0%, #1A2942 100%);
background-attachment: fixed;
font-feature-settings: 'cv11', 'ss01';
letter-spacing: -0.01em;
}
body.modal-open { overflow: hidden; position: fixed; width: 100%; }
.header {
position: sticky; top: 0; z-index: 50;
padding: 20px 16px 16px;
background: linear-gradient(180deg, rgba(26, 41, 66, 0.94) 0%, rgba(26, 41, 66, 0.85) 70%, rgba(26, 41, 66, 0) 100%);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border-bottom: 1px solid var(--border);
}
.header-top { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 18px; max-width: 720px; margin-left: auto; margin-right: auto; position: relative; }
.header-top::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 60px; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(232, 184, 90, 0.6) 50%, transparent 100%); pointer-events: none; }
.brand-icon { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: var(--gold); filter: drop-shadow(0 2px 6px rgba(232, 184, 90, 0.35)); flex-shrink: 0; }
.header-brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--ink); display: flex; align-items: baseline; gap: 6px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }
.brand-pulperia { color: var(--ink); font-weight: 700; letter-spacing: 0.2px; }
.brand-herrera { background: linear-gradient(135deg, var(--green) 0%, #4CAF50 50%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; font-weight: 900; letter-spacing: -0.3px; filter: drop-shadow(0 1px 4px var(--green-glow)); }
.search-wrap { max-width: 720px; margin: 0 auto; position: relative; }
.search-wrap::before { content: ''; position: absolute; inset: 0; border-radius: 16px; padding: 1.5px; background: linear-gradient(145deg, rgba(255, 225, 140, 0.55) 0%, rgba(232, 184, 90, 0.20) 30%, rgba(232, 184, 90, 0.10) 50%, rgba(232, 184, 90, 0.20) 70%, rgba(255, 225, 140, 0.50) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; z-index: 3; transition: box-shadow 0.3s ease; }
.search-wrap:focus-within::before { background: linear-gradient(145deg, rgba(46, 125, 50, 0.75) 0%, rgba(46, 125, 50, 0.30) 50%, rgba(46, 125, 50, 0.70) 100%); box-shadow: 0 0 20px var(--green-glow); }
.search-input { width: 100%; border: none; background: radial-gradient(ellipse 90% 60% at 50% 0, rgba(255,255,255,.15), rgba(255,255,255,0) 70%), linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.22)), #16264a; border-radius: 16px; padding: 15px 46px 15px 50px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500; color: var(--ink); outline: none; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 8px 12px -2px rgba(0,0,0,.85), 0 16px 26px -6px rgba(0,0,0,.65), 0 0 14px rgba(0,0,0,.45), inset 0 1.5px 0 rgba(255,255,255,.38), inset 0 -4px 7px rgba(0,0,0,.35); transition: all 0.15s ease; position: relative; z-index: 2; }
.search-input:active { transform: scale(0.98); box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.6), inset 0 -1px 0 rgba(255, 255, 255, 0.02), 0 2px 4px rgba(0, 0, 0, 0.2); }
.search-input::placeholder { color: rgba(230, 236, 247, 0.6); font-weight: 500; letter-spacing: 0.2px; }
.search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--gold); pointer-events: none; z-index: 4; filter: drop-shadow(0 1px 3px rgba(232, 184, 90, 0.35)); transition: transform 0.25s ease; }
.search-wrap:focus-within .search-icon { color: var(--green); filter: drop-shadow(0 1px 4px var(--green-glow)); transform: translateY(-50%) scale(1.1); }
.search-clear { position: absolute; right: 16px; top: 50%; transform: translateY(-50%) scale(0.9); background: transparent; border: none; color: var(--ink-mute); cursor: pointer; display: none; align-items: center; justify-content: center; padding: 4px; z-index: 4; transition: all 0.2s ease; }
.search-clear:active { color: var(--ink); transform: translateY(-50%) scale(0.8); }
.search-clear.show { display: flex; }

.cats-sticky { position: sticky; top: 130px; z-index: 45; background: transparent; border-bottom: none; transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.25s ease; will-change: transform; padding-bottom: 5px; }
.cats-sticky.hidden { transform: translateY(-200%); opacity: 0; pointer-events: none; }
.cats { max-width: 720px; margin: 0 auto; padding: 10px 16px 14px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); }
.cats::-webkit-scrollbar { display: none; }
.cat-chip { flex-shrink: 0; position: relative; border: none; background: linear-gradient(180deg, var(--bg-elev) 0%, var(--bg-soft) 100%); color: var(--ink-soft); border-radius: 22px; padding: 10px 18px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: -0.1px; cursor: pointer; transition: all 0.25s cubic-bezier(0.32, 0.72, 0, 1); white-space: nowrap; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
.cat-chip::before { content: ''; position: absolute; inset: 0; border-radius: 22px; padding: 1px; background: linear-gradient(145deg, rgba(255, 225, 140, 0.45) 0%, rgba(232, 184, 90, 0.20) 30%, rgba(232, 184, 90, 0.08) 50%, rgba(232, 184, 90, 0.20) 70%, rgba(255, 225, 140, 0.40) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; z-index: 2; }
.cat-chip:active { transform: scale(0.94); }
.cat-chip.active { background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%); color: #FFF; font-weight: 800; box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.6), inset 0 -1px 0 rgba(255, 255, 255, 0.1), 0 1px 2px rgba(0, 0, 0, 0.3); }
.cat-chip.active::before { background: linear-gradient(145deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0.10) 50%, rgba(255, 255, 255, 0.28) 100%); }

.grid-wrap { max-width: 720px; margin: 0 auto; padding: 0px 16px 20px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

/* ===== TARJETA DE RESPUESTA IA ===== */
.ia-response-card {
display: none;
background: linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%);
border-radius: 20px;
padding: 18px 20px;
margin-bottom: 20px;
position: relative;
box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
border: 1px solid var(--border-strong);
animation: fadeInIA 0.4s ease forwards;
}
.ia-response-card.show { display: block; }
@keyframes fadeInIA { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.ia-response-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.ia-response-icon { color: var(--gold); filter: drop-shadow(0 0 6px var(--gold-glow)); }
.ia-response-title { font-size: 14px; font-weight: 800; color: var(--gold); letter-spacing: 0.5px; text-transform: uppercase; }
.ia-response-text { font-size: 14.5px; line-height: 1.5; color: var(--ink); margin-bottom: 12px; }
.ia-response-loading { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-size: 14px; font-weight: 500; }
.ia-spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.card { position: relative; background: var(--card-body-bg-2); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 2px 4px rgba(0, 0, 0, 0.45), 0 8px 16px rgba(0, 0, 0, 0.45), 0 20px 40px rgba(0, 0, 0, 0.55), 0 40px 60px -20px rgba(0, 0, 0, 0.65); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1), box-shadow 0.3s ease; will-change: transform; transform: translateY(0); }
.card::before { content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 2.5px; background: linear-gradient(145deg, rgba(255, 225, 140, 0.90) 0%, rgba(232, 184, 90, 0.50) 22%, rgba(232, 184, 90, 0.22) 50%, rgba(232, 184, 90, 0.50) 78%, rgba(255, 225, 140, 0.85) 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; z-index: 2; box-shadow: 0 0 14px rgba(232, 184, 90, 0.18); }
.card::after { content: ''; position: absolute; left: 6%; right: 6%; bottom: -12px; height: 24px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(232, 184, 90, 0.32) 0%, rgba(232, 184, 90, 0) 70%); filter: blur(10px); pointer-events: none; z-index: 0; transition: opacity 0.3s ease, bottom 0.3s ease; opacity: 0.9; }
.card:hover { transform: translateY(-6px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 4px 8px rgba(0, 0, 0, 0.50), 0 14px 28px rgba(0, 0, 0, 0.50), 0 30px 55px rgba(0, 0, 0, 0.60), 0 55px 80px -20px rgba(0, 0, 0, 0.70); }
.card:hover::after { opacity: 1; bottom: -16px; }
.card:hover::before { box-shadow: 0 0 22px rgba(232, 184, 90, 0.30); }
.card:active { transform: translateY(-2px) scale(0.98); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 2px 6px rgba(0, 0, 0, 0.45), 0 8px 16px rgba(0, 0, 0, 0.40); transition: transform 0.12s ease, box-shadow 0.12s ease; }
.card.falta-inv::before { background: linear-gradient(145deg, rgba(252, 211, 77, 0.95) 0%, rgba(232, 184, 90, 0.55) 50%, rgba(252, 211, 77, 0.90) 100%); box-shadow: 0 0 12px rgba(252, 211, 77, 0.20); }
.card.falta-loy::before { background: linear-gradient(145deg, rgba(248, 113, 113, 0.95) 0%, rgba(239, 68, 68, 0.55) 50%, rgba(248, 113, 113, 0.90) 100%); box-shadow: 0 0 12px rgba(239, 68, 68, 0.20); }
.card.pulsing { animation: cardPulse 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
@keyframes cardPulse { 0% { transform: scale(1); } 40% { transform: scale(0.95); } 100% { transform: scale(1); } }
.card-feedback { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%); color: #FFF; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), 0 12px 32px var(--green-glow), 0 4px 12px rgba(0, 0, 0, 0.4); opacity: 0; pointer-events: none; z-index: 10; transform: translate(-50%, -50%) scale(0); }
.card-feedback.show { animation: feedbackPop 0.9s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
@keyframes feedbackPop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 45% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; } }
.card-foto-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: var(--bg-deep); overflow: hidden; box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(0, 0, 0, 0.30); z-index: 1; }
.card-foto-wrap::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(180deg, rgba(0,0,0,0.40) 0%, transparent 100%); z-index: 3; pointer-events: none; }
.card-foto { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.95) contrast(1.03); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
.card:hover .card-foto { transform: scale(1.03); }
.card-foto-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--ink-mute); background: radial-gradient(ellipse at center, rgba(42, 61, 98, 0.7) 0%, rgba(22, 34, 56, 0.95) 100%); }
.ribbon-wrap { position: absolute; bottom: 0; right: 0; width: 92px; height: 92px; overflow: hidden; pointer-events: none; z-index: 4; }
.ribbon { position: absolute; bottom: 19px; right: -34px; width: 130px; padding: 5px 0; text-align: center; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; transform: rotate(-45deg); background: linear-gradient(135deg, #E8B85A 0%, #C99B3F 100%); color: #1A1208; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35); }
.ribbon.ribbon-loy { background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%); color: #FFF; }
.card-body { padding: 14px 14px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; position: relative; background: linear-gradient(180deg, var(--card-body-bg-1) 0%, var(--card-body-bg-2) 100%); border-top: 1px solid rgba(255, 255, 255, 0.10); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), inset 0 6px 10px -4px rgba(0, 0, 0, 0.35); z-index: 2; }
.card-body::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.20) 30%, rgba(255, 255, 255, 0.25) 50%, rgba(255, 255, 255, 0.20) 70%, transparent 100%); pointer-events: none; }
.card-nombre { font-size: 13.5px; font-weight: 600; line-height: 1.35; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; letter-spacing: -0.15px; }
.card-footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: auto; width: 100%; }
.card-left { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
.card-precio { font-size: 16px; font-weight: 900; background: linear-gradient(135deg, #4CAF50 0%, var(--green) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; letter-spacing: -0.4px; text-shadow: 0 1px 6px var(--green-glow); }
.card-stock { font-size: 11px; font-weight: 600; color: var(--ink-mute); letter-spacing: 0.1px; }
.card-stock.stock-cero { color: var(--red-strong); font-weight: 800; }
.card-cart { position: relative; flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border-strong); background: linear-gradient(180deg, var(--bg-elev) 0%, var(--bg-soft) 100%); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-inset-top); transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease; }
.card-cart.con-items { background: linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%); color: #FFF; border-color: transparent; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.30), 0 4px 12px var(--green-glow); }
.card-cart.con-items.bump { animation: cartBump 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
@keyframes cartBump { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
.card-cart.bloqueado { background: linear-gradient(180deg, var(--bg-hover) 0%, var(--bg-soft) 100%); color: var(--ink-mute); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
.card-cart-badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #FFFFFF; color: #0B1322; font-size: 11px; font-weight: 800; display: none; align-items: center; justify-content: center; border: 2px solid var(--card-body-bg-2); box-shadow: 0 2px 6px rgba(0,0,0,0.45); letter-spacing: 0; }
.card-cart.con-items .card-cart-badge { display: flex; }
.card-cart-badge.bump { animation: badgeBump 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
@keyframes badgeBump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
.empty { grid-column: 1 / -1; padding: 70px 20px; text-align: center; color: var(--ink-mute); font-size: 14px; line-height: 1.6; }
.empty strong { display: block; color: var(--ink); font-size: 17px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.2px; }
.loading { grid-column: 1 / -1; padding: 70px 20px; text-align: center; color: var(--ink-mute); font-size: 14px; }
.spinner { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,0.08); border-top-color: var(--green); border-radius: 50%; margin: 0 auto 16px; animation: spin 0.9s linear infinite; }
.sentinel { grid-column: 1 / -1; height: 60px; display: flex; align-items: center; justify-content: center; }
.spinner-sm { width: 22px; height: 22px; border-width: 2px; margin: 0; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(6, 11, 20, 0.75); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 1000; align-items: flex-end; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal-sheet { background: radial-gradient(ellipse 120% 60% at 50% -10%, #3A4F76 0%, transparent 50%), linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%); width: 100%; max-width: 720px; max-height: 88vh; border-radius: 26px 26px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.08); border-top: 1px solid var(--border-strong); border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; overflow: hidden; }
.modal-sheet::before { content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(255, 235, 170, 0.65) 50%, transparent 100%); pointer-events: none; z-index: 5; }
.modal-overlay.show .modal-sheet { transform: translateY(0); }
.modal-handle { width: 44px; height: 4px; background: linear-gradient(90deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.30) 50%, rgba(255, 255, 255, 0.10) 100%); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; position: relative; z-index: 6; }
.modal-head { padding: 20px 60px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; flex-shrink: 0; position: relative; z-index: 4; gap: 4px; }
.modal-titulo { font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -0.4px; position: relative; padding-bottom: 10px; }
.modal-titulo::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 40px; height: 2px; background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%); border-radius: 1px; opacity: 0.85; }
.modal-subtitulo { font-size: 12.5px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0.1px; margin-top: 6px; }
.btn-vaciar-float { position: absolute; top: 18px; left: 18px; width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--red-border); background: linear-gradient(180deg, var(--red-soft) 0%, rgba(239, 68, 68, 0.05) 100%); color: var(--red-strong); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s ease, background 0.15s ease; z-index: 10; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 2px 6px rgba(0, 0, 0, 0.25); }

<script>
const URL_API_GOOGLE = "https://script.google.com/macros/s/AKfycbwS3zwDj7NU1l4P580O2c28oVTi0y1OrY-iLB-PiXMU5KyoYpr2mRRz0LTcmWDuqRhalg/exec"; 
const WHATSAPP_NUM = '50661446321';
const STORAGE_KEY = 'carrito_ph_v1';
const CATALOGO_KEY = 'catalogo_ph_v1';
const PRODUCTOS_POR_PAGINA = 30;

let productos = [];
let productosFiltrados = [];
let categoriaActiva = 'Todas';
let busqueda = '';
let carrito = [];
let pago = null;
let searchTimer = null;
let iaTimer = null;
let productosMostrados = 0;
let sentinelEl = null;
let sentinelObserver = null;
const tarjetasRefs = {};
let productoModal = null;
let scrollBloqueadoY = 0;
let lastY = 0;

const SHOW_THRESHOLD = 2;
const HIDE_THRESHOLD = 10;
const TOP_SAFE_ZONE = 130;

const grid = document.getElementById('grid');
const catsSticky = document.getElementById('catsSticky');
const header = document.getElementById('header');
const dock = document.getElementById('dock');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const iaResponseCard = document.getElementById('iaResponseCard');
const iaResponseContent = document.getElementById('iaResponseContent');

function fmt(n) { return '₡' + (Number(n) || 0).toLocaleString('es-CR'); }

function showToast(msg, tipo) {
const t = document.getElementById('toast');
t.innerText = msg;
t.className = 'toast show' + (tipo ? ' ' + tipo : '');
setTimeout(function() { t.className = 'toast'; }, 2600);
}

function escaparHTML(s) {
return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function haptic(ms) { if (navigator.vibrate) navigator.vibrate(ms || 15); }

function bloquearScroll() {
scrollBloqueadoY = window.scrollY;
document.body.style.top = -scrollBloqueadoY + 'px';
document.body.classList.add('modal-open');
}

function desbloquearScroll() {
document.body.classList.remove('modal-open');
document.body.style.top = '';
window.scrollTo(0, scrollBloqueadoY);
}

function hayModalAbierto() { return document.querySelector('.modal-overlay.show') !== null || document.getElementById('confirmOverlay').classList.contains('show'); }

function crearRipple(e, boton) {
const rect = boton.getBoundingClientRect();
const x = (e.clientX || (rect.left + rect.width / 2)) - rect.left;
const y = (e.clientY || (rect.top + rect.height / 2)) - rect.top;
const size = Math.max(rect.width, rect.height) * 2;
const ripple = document.createElement('span');
ripple.className = 'ripple';
ripple.style.width = size + 'px';
ripple.style.height = size + 'px';
ripple.style.left = (x - size / 2) + 'px';
ripple.style.top = (y - size / 2) + 'px';
boton.appendChild(ripple);
setTimeout(function() { ripple.remove(); }, 650);
}

function ajustarStickyCats() {
if (header && catsSticky) {
const h = header.getBoundingClientRect().height;
catsSticky.style.top = h + 'px';
}
}

function onScroll() {
const y = window.scrollY;
if (y < TOP_SAFE_ZONE) {
if (catsSticky.classList.contains('hidden')) { catsSticky.classList.remove('hidden'); }
lastY = y;
return;
}
const diff = y - lastY;
if (diff <= -SHOW_THRESHOLD) {
catsSticky.classList.remove('hidden');
lastY = y;
} else if (diff >= HIDE_THRESHOLD) {
catsSticky.classList.add('hidden');
lastY = y;
}
}

function guardarCarrito() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(carrito)); } catch (e) {} }
function cargarCarritoGuardado() { try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) carrito = JSON.parse(raw) || []; } catch (e) { carrito = []; } }
function limpiarCarritoGuardado() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }
function guardarCatalogoCache(lista) { try { localStorage.setItem(CATALOGO_KEY, JSON.stringify({ ts: Date.now(), items: lista })); } catch (e) {} }
function leerCatalogoCache() { try { const raw = localStorage.getItem(CATALOGO_KEY); if (!raw) return null; const data = JSON.parse(raw); if (!data || !data.items) return null; return data.items; } catch (e) { return null; } }

function normalizarTexto(texto) {
return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

// ============================================================
// CONEXIÓN CON LA IA (GET PARA EVITAR CORS)
// ============================================================
function consultarIAApp(pregunta) {
  iaResponseCard.classList.add('show');
  iaResponseContent.innerHTML = '<div class="ia-response-loading"><div class="ia-spinner"></div> Consultando el catálogo...</div>';
  
  fetch(URL_API_GOOGLE + '?action=consultarIA&pregunta=' + encodeURIComponent(pregunta))
    .then(response => response.json())
    .then(function(resp) {
      if (resp.success) {
        iaResponseContent.innerText = resp.respuesta;
        
        if (resp.productos && resp.productos.length > 0) {
          productosFiltrados = resp.productos;
          grid.style.display = 'grid';
          renderGrid(); 
        } else {
          grid.style.display = 'none';
        }
      } else {
        iaResponseContent.innerText = "Lo siento, en este momento no puedo procesar la consulta. " + (resp.message || '');
        grid.style.display = 'grid';
      }
    })
    .catch(function(err) {
      grid.style.display = 'grid';
      iaResponseContent.innerText = "Error de conexión al buscar con la IA.";
    });
}

function cargarCatalogo() {
  const cacheLocal = leerCatalogoCache();
  if (cacheLocal && cacheLocal.length) {
    productos = cacheLocal;
    sincronizarCarritoConCatalogo();
    construirCategorias();
    aplicarFiltros();
    actualizarCarrito();
  }
  fetch(URL_API_GOOGLE, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'obtenerCatalogo' })
  })
  .then(response => response.json())
  .then(function(resp) {
    if (!resp.success) {
      if (!cacheLocal || !cacheLocal.length) {
        grid.innerHTML = '<div class="empty"><strong>Error</strong>' + escaparHTML(resp.message) + '</div>';
      }
      return;
    }
   productos = (resp.productos || []).map(function(p) {
  return { nombre: p.nombre, precio: p.precio, foto: p.foto, categoria: p.categoria, estado: p.estado, stock: p.stock, etiquetas: p.etiquetas };
});
    guardarCatalogoCache(productos);
    sincronizarCarritoConCatalogo();
    construirCategorias();
    aplicarFiltros();
    actualizarCarrito();
  })
  .catch(function(err) {
    if (!cacheLocal || !cacheLocal.length) {
      grid.innerHTML = '<div class="empty"><strong>Error de conexión</strong>' + escaparHTML(err) + '</div>';
    }
  });
}
function sincronizarCarritoConCatalogo() {
const mapa = {};
productos.forEach(function(p) { mapa[p.nombre] = p; });
carrito = carrito.map(function(it) {
const p = mapa[it.nombre];
if (p) { return { nombre: it.nombre, precio: p.precio, foto: p.foto || it.foto, cantidad: it.cantidad, stock: p.stock }; }
return it;
});
guardarCarrito();
}

function construirCategorias() {
const cats = new Set();
productos.forEach(function(p) { if (p.categoria) cats.add(p.categoria); });
const catsArr = Array.from(cats).sort(function(a,b){ return a.localeCompare(b,'es',{sensitivity:'base'}); });
const cont = document.getElementById('cats');
cont.innerHTML = '';
const todas = document.createElement('button');
todas.className = 'cat-chip active';
todas.innerText = 'Todas';
todas.dataset.cat = 'Todas';
todas.addEventListener('click', function() { setCategoria('Todas'); });
cont.appendChild(todas);
catsArr.forEach(function(c) {
const btn = document.createElement('button');
btn.className = 'cat-chip';
btn.innerText = c;
btn.dataset.cat = c;
btn.addEventListener('click', function() { setCategoria(c); });
cont.appendChild(btn);
});
}

function setCategoria(cat) {
categoriaActiva = cat;
document.querySelectorAll('.cat-chip').forEach(function(el) { el.classList.toggle('active', el.dataset.cat === cat); });
window.scrollTo({ top: 0, behavior: 'smooth' });
catsSticky.classList.remove('hidden');
lastY = 0;
aplicarFiltros();
}

function aplicarFiltros() {
  const q = busqueda.trim().toLowerCase();
  const qNormalizada = normalizarTexto(q);

  // Función auxiliar para quitar plurales (ej. "refrescos" -> "refresco")
  function obtenerRaiz(texto) {
    return (texto.length > 3 && texto.endsWith('s')) ? texto.slice(0, -1) : texto;
  }

  // Primero filtramos por categoría
  let resultadosBase = productos.filter(function(p) {
    return (categoriaActiva === 'Todas' || p.categoria === categoriaActiva);
  });

  if (!qNormalizada) {
    productosFiltrados = resultadosBase;
  } else {
    // Separamos la búsqueda en palabras sueltas
    const palabras = qNormalizada.split(' ').filter(function(w) { return w.length > 1; });

    // Puntuamos cada producto
    let productosPuntuados = resultadosBase.map(function(p) {
      let puntos = 0;
      const nombreNorm = normalizarTexto(p.nombre);
      const categoriaNorm = normalizarTexto(p.categoria || '');
      const etiquetasNorm = normalizarTexto(p.etiquetas || '');

      // Evaluar cada palabra que escribió el usuario
      palabras.forEach(function(palabra) {
        const raiz = obtenerRaiz(palabra);

        // ¿Está en el nombre? (Alta prioridad)
        if (nombreNorm.indexOf(raiz) !== -1) {
          puntos += 100;
        } 
        // ¿Está en la categoría? (Media prioridad)
        else if (categoriaNorm.indexOf(raiz) !== -1) {
          puntos += 50;
        }
        // ¿Está en las etiquetas? (Baja prioridad)
        else if (etiquetasNorm.indexOf(raiz) !== -1) {
          puntos += 10;
        }
      });

      return { producto: p, puntos: puntos };
    });

    // Nos quedamos solo con los que sumaron al menos 1 punto y los ordenamos del más relevante al menos
    productosPuntuados = productosPuntuados.filter(function(item) {
      return item.puntos > 0;
    });

    productosPuntuados.sort(function(a, b) {
      return b.puntos - a.puntos;
    });

    // Extraemos solo los productos ordenados
    productosFiltrados = productosPuntuados.map(function(item) {
      return item.producto;
    });
  }

  renderGrid();
}

function renderGrid() {
Object.keys(tarjetasRefs).forEach(function(k) { delete tarjetasRefs[k]; });
if (sentinelEl && sentinelObserver) sentinelObserver.unobserve(sentinelEl);
sentinelEl = null;
productosMostrados = 0;
grid.innerHTML = '';
if (productosFiltrados.length === 0) {
grid.innerHTML = '<div class="empty"><strong>Sin resultados</strong>No se encontraron productos con ese criterio.</div>';
}
cargarMasProductos();
}

function cargarMasProductos() {
const inicio = productosMostrados;
const fin = Math.min(inicio + PRODUCTOS_POR_PAGINA, productosFiltrados.length);
const fragment = document.createDocumentFragment();
for (let i = inicio; i < fin; i++) {
const card = crearTarjeta(productosFiltrados[i]);
fragment.appendChild(card);
}
grid.appendChild(fragment);
productosMostrados = fin;
gestionarSentinel();
}

function gestionarSentinel() {
if (sentinelEl) {
if (sentinelObserver) sentinelObserver.unobserve(sentinelEl);
sentinelEl.remove();
sentinelEl = null;
}
if (productosMostrados >= productosFiltrados.length) return;
sentinelEl = document.createElement('div');
sentinelEl.className = 'sentinel';
sentinelEl.innerHTML = '<div class="spinner spinner-sm"></div>';
grid.appendChild(sentinelEl);
if (!sentinelObserver) {
sentinelObserver = new IntersectionObserver(function(entries) {
if (entries[0].isIntersecting && productosMostrados < productosFiltrados.length) { cargarMasProductos(); }
}, { rootMargin: '400px' });
}
sentinelObserver.observe(sentinelEl);
}

function crearTarjeta(p) {
const card = document.createElement('div');
card.className = 'card';
if (p.estado === 'FALTA_INV') card.classList.add('falta-inv');
else if (p.estado === 'FALTA_LOY') card.classList.add('falta-loy');
const fotoWrap = document.createElement('div');
fotoWrap.className = 'card-foto-wrap';
if (p.foto) {
const img = document.createElement('img');
img.className = 'card-foto';
img.src = p.foto;
img.alt = '';
img.loading = 'lazy';
img.onerror = function() { this.replaceWith(crearPlaceholder()); };
fotoWrap.appendChild(img);
} else { fotoWrap.appendChild(crearPlaceholder()); }
if (p.estado === 'FALTA_INV' || p.estado === 'FALTA_LOY') {
const wrap = document.createElement('div');
wrap.className = 'ribbon-wrap';
const rib = document.createElement('div');
rib.className = 'ribbon' + (p.estado === 'FALTA_LOY' ? ' ribbon-loy' : '');
rib.innerText = 'NUEVO';
wrap.appendChild(rib);
fotoWrap.appendChild(wrap);
}
card.appendChild(fotoWrap);
const body = document.createElement('div');
body.className = 'card-body';
const nombre = document.createElement('div');
nombre.className = 'card-nombre';
nombre.innerText = p.nombre;
body.appendChild(nombre);
const footer = document.createElement('div');
footer.className = 'card-footer';
const leftCol = document.createElement('div');
leftCol.className = 'card-left';
const precio = document.createElement('div');
precio.className = 'card-precio';
precio.innerText = fmt(p.precio);
leftCol.appendChild(precio);
if (p.stock !== null && p.stock !== undefined) {
const stockEl = document.createElement('div');
stockEl.className = 'card-stock' + (p.stock <= 0 ? ' stock-cero' : '');
stockEl.innerText = 'Stock: ' + p.stock;
leftCol.appendChild(stockEl);
}
footer.appendChild(leftCol);
const cartIcon = document.createElement('div');
cartIcon.className = 'card-cart';

setTimeout(function() { card.classList.remove('pulsing'); }, 400);

cartIcon.addEventListener('click', function(e) {

if (p.stock !== null && p.stock <= 0) { showToast('Sin stock disponible'); return; }

}

function aplicarEstadoCarrito(nombre, animarBadge) {
const ref = tarjetasRefs[nombre];
if (!ref) return;
const it = carrito.find(function(x){ return x.nombre === nombre; });
const cant = it ? it.cantidad : 0;
const prod = productos.find(function(x){ return x.nombre === nombre; });
const stockCero = prod && prod.stock !== null && prod.stock !== undefined && prod.stock <= 0;
const alcanzoTope = stockCero || (prod && prod.stock !== null && prod.stock !== undefined && cant >= prod.stock);
ref.badge.innerText = cant;
ref.cartIcon.classList.toggle('con-items', cant > 0);
ref.cartIcon.classList.toggle('bloqueado', alcanzoTope && cant === 0);
if (animarBadge && cant > 0) {
ref.badge.classList.remove('bump'); void ref.badge.offsetWidth; ref.badge.classList.add('bump');
setTimeout(function() { ref.badge.classList.remove('bump'); }, 400);
ref.cartIcon.classList.remove('bump'); void ref.cartIcon.offsetWidth; ref.cartIcon.classList.add('bump');
setTimeout(function() { ref.cartIcon.classList.remove('bump'); }, 400);
}
}

function actualizarTodasLasTarjetas() { Object.keys(tarjetasRefs).forEach(function(nombre) { aplicarEstadoCarrito(nombre, false); }); }

function mostrarFeedback(card) {

function agregarAlCarrito(p, mostrarToast) {
if (mostrarToast === undefined) mostrarToast = true;
const idx = carrito.findIndex(function(it){ return it.nombre === p.nombre; });
const cantActual = idx >= 0 ? carrito[idx].cantidad : 0;
if (p.stock !== null && p.stock !== undefined && cantActual >= p.stock) { if (mostrarToast) showToast('Solo hay ' + p.stock + ' disponibles'); return; }
if (idx >= 0) carrito[idx].cantidad++;
else carrito.push({ nombre: p.nombre, precio: p.precio, foto: p.foto, cantidad: 1, stock: p.stock });
guardarCarrito();
actualizarCarrito();
aplicarEstadoCarrito(p.nombre, true);
if (mostrarToast) showToast('Agregado: ' + p.nombre, 'success');
}

function quitarDelCarrito(nombre) {
carrito = carrito.filter(function(it){ return it.nombre !== nombre; });
guardarCarrito();
actualizarCarrito();
aplicarEstadoCarrito(nombre, false);
}

function cambiarCantidad(nombre, delta) {
const item = carrito.find(function(it){ return it.nombre === nombre; });
if (!item) return;
const stock = item.stock;
const nuevo = item.cantidad + delta;
if (delta > 0 && stock !== null && stock !== undefined && item.cantidad >= stock) { showToast('Solo hay ' + stock + ' disponibles'); return; }
if (nuevo <= 0) { quitarDelCarrito(nombre); renderCarrito(); }
else {
item.cantidad = nuevo;
guardarCarrito();
actualizarCarrito();
aplicarEstadoCarrito(nombre, delta > 0);
renderCarrito();
}
}

function pedirVaciar() {
if (carrito.length === 0) return;
haptic(15);
const total = totalItems();
document.getElementById('confirmTexto').innerText = 'Se borrarán los ' + total + ' producto' + (total === 1 ? '' : 's') + ' que agregaste.';
document.getElementById('confirmOverlay').classList.add('show');
}

function cerrarConfirm() {
document.getElementById('confirmOverlay').classList.remove('show');
if (!hayModalAbierto()) desbloquearScroll();
}

function confirmarVaciar() {
carrito = [];
guardarCarrito();
actualizarCarrito();
actualizarTodasLasTarjetas();
cerrarConfirm();
cerrarCarrito();
showToast('Pedido vaciado');
}

function totalCarrito() { return carrito.reduce(function(s, it){ return s + (it.precio * it.cantidad); }, 0); }
function totalItems() { return carrito.reduce(function(s, it){ return s + it.cantidad; }, 0); }

function actualizarCarrito() {
const count = totalItems();
const total = totalCarrito();
dock.classList.toggle('show', count > 0);
document.getElementById('cartPillCount').textContent = count;
document.getElementById('cartPillTotal').textContent = fmt(total);
document.getElementById('cartTotal').innerText = fmt(total);
const countTxt = count === 1 ? '1 producto' : count + ' productos';
document.getElementById('cartTotalCount').innerText = countTxt;
dock.classList.remove('pulse');
void dock.offsetWidth;
dock.classList.add('pulse');
drawOutline();
}

function drawOutline(){
if (!dock || dock.clientWidth === 0) return;
var W=dock.clientWidth,Hs=64,cx=W/2,bw=128,bh=54,bs=12,r=24,R=16,cr=10,T=112,wmax=2.7,wmin=.7,k=Math.PI/180;
var bl=cx-bw/2,x0=Math.max(cr+8,bl-56),rx=bl-x0,P=[],a,x;
function wd(d){return wmin+(wmax-wmin)*Math.min(Math.max(d/T,0),1);}
function add(px,py,w){P.push({x:px,y:py,w:w});}
for(a=180;a>=90;a-=10)add(cr+cr*Math.cos(a*k),bs-cr+cr*Math.sin(a*k),wmax);
for(x=cr+8;x<x0;x+=8)add(x,bs,wd(bl-x));
for(a=0;a<=90;a+=5){x=x0+rx*Math.sin(a*k);add(x,bs+r-r*Math.cos(a*k),wd(bl-x));}
for(a=180;a>=90;a-=10){x=bl+R+R*Math.cos(a*k);add(x,bh-R+R*Math.sin(a*k),wmin+(wmax-wmin)*((x-bl)/R));}
add(cx,bh,wmax);
var M=P.slice(0,-1).reverse().map(function(p){return {x:W-p.x,y:p.y,w:p.w};}),F=P.concat(M),n=F.length,o=[],q=[];
F.forEach(function(p,i){
var A=F[Math.max(i-1,0)],B=F[Math.min(i+1,n-1)],dx=B.x-A.x,dy=B.y-A.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
o.push((p.x+nx*p.w).toFixed(2)+' '+(Hs-(p.y+ny*p.w)).toFixed(2));
q.push((p.x-nx*.3).toFixed(2)+' '+(Hs-(p.y-ny*.3)).toFixed(2));
});
var br=bl+bw,b0=8,rb=16,B=[],y,oB=[],qB=[];
function addB(px,py){B.push({x:px,y:py});}
for(y=bs+r;y>b0+rb;y-=4)addB(bl,y);
for(a=180;a<=270;a+=10)addB(bl+rb+rb*Math.cos(a*k),b0+rb+rb*Math.sin(a*k));
addB(cx,b0);
for(a=270;a<=360;a+=10)addB(br-rb+rb*Math.cos(a*k),b0+rb+rb*Math.sin(a*k));
for(y=b0+rb+4;y<=bs+r;y+=4)addB(br,y);
B.forEach(function(p,i){
var A=B[Math.max(i-1,0)],C=B[Math.min(i+1,B.length-1)],dx=C.x-A.x,dy=C.y-A.y,l=Math.hypot(dx,dy)||1,nx=dy/l,ny=-dx/l;
oB.push((p.x+nx*wmin).toFixed(2)+' '+(Hs-(p.y+ny*wmin)).toFixed(2));
qB.push((p.x-nx*.3).toFixed(2)+' '+(Hs-(p.y-ny*.3)).toFixed(2));
});
var s=document.getElementById('outline');
if(s){
s.setAttribute('width',W);s.setAttribute('height',Hs);s.setAttribute('viewBox','0 0 '+W+' '+Hs);
document.getElementById('outlinePath').setAttribute('d','M'+o.join('L')+'L'+q.reverse().join('L')+'Z');
document.getElementById('outlinePath2').setAttribute('d','M'+oB.join('L')+'L'+qB.reverse().join('L')+'Z');
}
}

function abrirModalProducto(p) { productoModal = p; renderModalProducto(); document.getElementById('modalProducto').classList.add('show'); bloquearScroll(); }
function cerrarModalProducto() { document.getElementById('modalProducto').classList.remove('show'); productoModal = null; if (!hayModalAbierto()) desbloquearScroll(); }

img.onerror = function() { const ph = document.createElement('div'); ph.className = 'pm-foto-ph'; ph.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>'; this.replaceWith(ph); };

} else { const ph = document.createElement('div'); ph.className = 'pm-foto-ph'; ph.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>'; fotoWrap.appendChild(ph); }

const stockEl = document.getElementById('pmStock');

else if (p.stock <= 0) { stockEl.innerText = 'Sin stock'; stockEl.className = 'pm-stock zero'; }
else if (p.stock <= 3) { stockEl.innerText = 'Quedan ' + p.stock + ' disponibles'; stockEl.className = 'pm-stock low'; }
else { stockEl.innerText = 'Stock: ' + p.stock + ' disponibles'; stockEl.className = 'pm-stock'; }

function actualizarCantidadModal(animar) {
if (!productoModal) return;
const p = productoModal;
const it = carrito.find(function(x){ return x.nombre === p.nombre; });
const cant = it ? it.cantidad : 0;

qtyEl.innerText = cant;

if (cant <= 0) { btnMenos.classList.add('bloqueado'); } else { btnMenos.classList.remove('bloqueado'); }

}

function modalMas() { if (!productoModal) return; const p = productoModal; const it = carrito.find(function(x){ return x.nombre === p.nombre; }); const cant = it ? it.cantidad : 0; if (p.stock !== null && p.stock !== undefined && cant >= p.stock) return; agregarAlCarrito(p, false); actualizarCantidadModal(true); haptic(10); }
function modalMenos() { if (!productoModal) return; const p = productoModal; const it = carrito.find(function(x){ return x.nombre === p.nombre; }); if (!it) return; cambiarCantidad(p.nombre, -1); actualizarCantidadModal(true); haptic(10); }

function abrirCarrito() { if (carrito.length === 0) { showToast('El carrito está vacío'); return; } renderCarrito(); document.getElementById('modalCarrito').classList.add('show'); bloquearScroll(); }

const btnMenos = document.createElement('button'); btnMenos.className = 'qty-btn'; btnMenos.innerText = '−'; btnMenos.setAttribute('aria-label', 'Restar'); btnMenos.addEventListener('click', function(){ cambiarCantidad(it.nombre, -1); }); ctrl.appendChild(btnMenos);

bottomRow.appendChild(ctrl); right.appendChild(bottomRow); card.appendChild(right); body.appendChild(card);
});

function abrirFormulario(e) {
if (carrito.length === 0) { showToast('El carrito está vacío'); return; }
if (e && e.currentTarget) { crearRipple(e, e.currentTarget); haptic(20); }
const resumen = document.getElementById('resumenPedido'); resumen.innerHTML = '';
carrito.forEach(function(it) { const row = document.createElement('div'); row.className = 'resumen-pedido-item'; row.innerHTML = '<span>' + it.cantidad + 'x ' + escaparHTML(it.nombre) + '</span><span>' + fmt(it.precio * it.cantidad) + '</span>'; resumen.appendChild(row); });
const totalRow = document.createElement('div'); totalRow.className = 'resumen-pedido-total'; totalRow.innerHTML = '<span>Total</span><span>' + fmt(totalCarrito()) + '</span>'; resumen.appendChild(totalRow);
document.getElementById('nombreCliente').value = '';
setPago(null);
cerrarCarrito();
document.getElementById('modalFormulario').classList.add('show');
bloquearScroll();
setTimeout(function(){ document.getElementById('nombreCliente').focus(); }, 400);
}
function cerrarFormulario() { document.getElementById('modalFormulario').classList.remove('show'); if (!hayModalAbierto()) desbloquearScroll(); }
function setPago(tipo) { pago = tipo; document.getElementById('pagoContado').classList.toggle('active', tipo === 'contado'); document.getElementById('pagoCredito').classList.toggle('active', tipo === 'credito'); }

function enviarPedido(e) {
const nombre = document.getElementById('nombreCliente').value.trim();
if (!nombre) { showToast('Escribí tu nombre', 'error'); document.getElementById('nombreCliente').focus(); return; }
if (!pago) { showToast('Elegí una forma de pago', 'error'); return; }
if (carrito.length === 0) { showToast('El carrito está vacío', 'error'); return; }
if (e && e.currentTarget) { crearRipple(e, e.currentTarget); haptic(20); }
const ahora = new Date();
const dia = String(ahora.getDate()).padStart(2, '0'); const mes = String(ahora.getMonth() + 1).padStart(2, '0');
const anio = String(ahora.getFullYear()).slice(-2); const hh = String(ahora.getHours()).padStart(2, '0'); const mm = String(ahora.getMinutes()).padStart(2, '0');
const fechaHora = dia + '/' + mes + '/' + anio + ' · ' + hh + ':' + mm;
const pagoTexto = (pago === 'credito' ? 'Crédito' : 'Contado');
let msg = '';
msg += '🌾 *PULPERÍA HERRERA*\n'; msg += '_Nuevo pedido_\n\n'; msg += '━━━━━━━━━━━━━━━\n'; msg += '👤 *' + nombre + '* · 💳 ' + pagoTexto + '\n'; msg += '🕒 ' + fechaHora + '\n'; msg += '━━━━━━━━━━━━━━━\n\n';
carrito.forEach(function(it, i) { const num = (i + 1) + '.'; msg += num + ' ' + it.cantidad + 'x ' + it.nombre + '\n'; msg += '   ' + fmt(it.precio) + ' c/u · ' + fmt(it.precio * it.cantidad) + '\n\n'; });
msg += '━━━━━━━━━━━━━━━\n'; msg += '💰 *TOTAL: ' + fmt(totalCarrito()) + '*\n'; msg += '━━━━━━━━━━━━━━━\n\n'; msg += '_Paso a recogerlo en unos minutos_ ✅';
const url = 'https://wa.me/' + WHATSAPP_NUM + '?text=' + encodeURIComponent(msg);
const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
carrito = []; limpiarCarritoGuardado(); actualizarCarrito(); actualizarTodasLasTarjetas(); cerrarFormulario(); showToast('¡Pedido enviado!', 'success');
}

document.addEventListener('DOMContentLoaded', function() {

window.addEventListener('resize', function(){ ajustarStickyCats(); drawOutline(); });
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(ajustarStickyCats); }

searchInput.addEventListener('input', function() {
    const val = this.value;
    if (val.length > 0) { searchClear.classList.add('show'); } else { searchClear.classList.remove('show'); }
    
    // Lógica del Enrutador
    const preguntaNormalizada = normalizarTexto(val);
    const esPregunta = val.includes('?') || 
                     /(quiero|para|necesito|receta|como|cocinar|hacer|sirve|dolor|duele|recomienda)/.test(preguntaNormalizada);

    // 1. Ocultamos la IA si el usuario vuelve a escribir algo que parece un producto
    iaResponseCard.classList.remove('show');
    grid.style.display = 'grid';

    // 2. Búsqueda normal
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
        busqueda = val;
        aplicarFiltros();
    }, 300);

    // 3. Detección de Intención para IA
    clearTimeout(iaTimer);
    if (val.trim().length > 5 && (esPregunta || val.split(' ').length > 3)) {
        iaTimer = setTimeout(function() {
            // Verificamos si la búsqueda normal no arrojó resultados o si es claramente una pregunta
            if (productosFiltrados.length === 0 || esPregunta) {
                consultarIAApp(val);
            }
        }, 1200);
    }
});

searchClear.addEventListener('click', function() {
    searchInput.value = '';
    this.classList.remove('show');
    busqueda = '';
    iaResponseCard.classList.remove('show');
    grid.style.display = 'grid';
    aplicarFiltros();
    searchInput.focus();
});

cargarCatalogo();
});
